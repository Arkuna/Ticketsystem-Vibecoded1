<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tickets</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="auth" hidden>
  <form id="authForm" class="authbox" autocomplete="on">
    <h1>Tickets</h1>
    <p id="authLead">Melde dich an, um Tickets zu sehen oder zu erstellen.</p>
    <label for="a-user">Benutzername</label>
    <input id="a-user" name="username" autocomplete="username" required maxlength="30">
    <label for="a-pw">Passwort</label>
    <input id="a-pw" name="password" type="password" autocomplete="current-password" required minlength="8">
    <div id="inviteRow" hidden>
      <label for="a-inv">Einladungscode</label>
      <input id="a-inv" name="invite" autocomplete="off">
    </div>
    <div class="err" id="authErr" role="alert"></div>
    <button class="primary wide" id="authSubmit" type="submit">Anmelden</button>
    <button class="link" id="authToggle" type="button">Noch kein Konto? Registrieren</button>
  </form>
</section>

<section id="app" hidden>
  <header>
    <h1>Tickets</h1>
    <span class="badge" id="role"></span>
    <input id="q" type="search" placeholder="Tickets durchsuchen" aria-label="Tickets durchsuchen" hidden>
    <select id="fp" aria-label="Nach Priorität filtern" hidden>
      <option value="">Alle Prioritäten</option><option>hoch</option><option>mittel</option><option>niedrig</option>
    </select>
    <span class="sp"></span>
    <button id="usersBtn" hidden>Benutzer</button>
    <button class="primary" id="new">Ticket erstellen</button>
    <button id="pwBtn">Passwort</button>
    <button id="logout">Abmelden</button>
  </header>
  <main id="main"></main>
</section>

<dialog id="dlg">
  <h3 id="dt">Neues Ticket</h3>
  <div id="sub"></div>
  <label for="f-title">Titel</label><input id="f-title" maxlength="140">
  <label for="f-desc">Beschreibung</label><textarea id="f-desc" rows="4" maxlength="5000"></textarea>
  <label for="f-type">Typ</label>
  <select id="f-type"><option value="aufgabe">Aufgabe</option><option value="bug">Fehler</option><option value="feature">Neue Funktion</option></select>
  <div class="tri" id="tri">
    <div class="row">
      <div><label for="f-stat">Status</label><select id="f-stat"></select></div>
      <div><label for="f-prio">Priorität</label><select id="f-prio"><option>hoch</option><option selected>mittel</option><option>niedrig</option></select></div>
    </div>
    <label for="f-ass">Zugewiesen an</label><input id="f-ass" maxlength="60" placeholder="Name">
  </div>
  <div class="comments" id="cbox" hidden>
    <h4>Verlauf</h4>
    <div id="clist"></div>
    <label for="f-cm">Nachricht</label>
    <textarea id="f-cm" rows="2" maxlength="2000"></textarea>
    <div class="cmrow">
      <label class="chk" id="intRow" hidden><input type="checkbox" id="f-int"> Interne Notiz (nur Team sieht sie)</label>
      <span class="sp"></span>
      <button id="cadd">Senden</button>
    </div>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="actions">
    <button class="primary" id="save">Speichern</button>
    <button id="cancel">Schließen</button>
    <span class="sp"></span>
    <button class="danger" id="del" hidden>Löschen</button>
  </div>
</dialog>

<dialog id="udlg">
  <h3>Benutzer</h3>
  <div id="ulist"></div>
  <div id="utemp"></div>
  <div class="err" id="uerr" role="alert"></div>
  <div class="actions"><button id="uclose">Schließen</button></div>
</dialog>
<dialog id="pdlg">
  <h3>Passwort ändern</h3>
  <label for="p-old">Altes Passwort</label><input id="p-old" type="password" autocomplete="current-password">
  <label for="p-new">Neues Passwort (mindestens 8 Zeichen)</label><input id="p-new" type="password" autocomplete="new-password" minlength="8">
  <div class="err" id="perr" role="alert"></div>
  <div class="actions"><button class="primary" id="psave">Ändern</button><button id="pclose">Abbrechen</button></div>
</dialog>
<script src="/app.js"></script>
</body>
</html>
